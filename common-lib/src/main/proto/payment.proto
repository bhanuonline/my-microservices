syntax = "proto3";

option java_package = "com.example.common.grpc.payment";
option java_multiple_files = true;
option java_outer_classname = "PaymentProto";

package payment;

service PaymentService {
  // Unary RPC — the simplest shape. For streaming examples see tier4-roadmap.md §7.
  rpc Charge (ChargeRequest) returns (ChargeResponse);
}

message ChargeRequest {
  string order_id = 1;
  string amount   = 2;   // decimal as string — avoid float for money
  string currency = 3;
  string idempotency_key = 4;
}

message ChargeResponse {
  string payment_id = 1;
  Status status     = 2;
  string failure_reason = 3;

  enum Status {
    UNKNOWN  = 0;
    SUCCEEDED = 1;
    FAILED    = 2;
  }
}
