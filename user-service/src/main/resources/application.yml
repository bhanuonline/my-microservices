spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:"   # allow startup even if config-server absent
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8095
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/userdb?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: pass1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    config:
      enabled: false          # config-server not implemented yet — disable client check
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        # Producer binding: <bean-or-bindingName>-out-0
        # Matches StreamBridge.send("userRegistered-out-0", ...) in UserEventPublisher
        userRegistered-out-0:
          destination: user.registered
          content-type: application/json

server:
  port: 8081

# Demo property for @RefreshScope — change this and POST /actuator/refresh
demo:
  greeting: "Hello from the ORIGINAL config"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env,configprops,loggers,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  # /actuator/info population — build/git from Maven plugins, java/os built-in
  info:
    env: { enabled: true }
    build: { enabled: true }
    git: { mode: full, enabled: true }
    java: { enabled: true }
    os: { enabled: true }
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

info:
  app:
    name: User Service
    description: User management REST API
    port: ${server.port:8090}

logging:
  level:
    org.hibernate.SQL: INFO   # DEBUG only in local profile; overridden in logback-spring.xml if desired

# Resilience4j — protects user-service's call out to product-service.
# Tune to your SLO. These values favour fast fail-open over slow retries so
# user-facing latency stays bounded when product-service is degraded.
resilience4j:
  circuitbreaker:
    instances:
      productClient:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50          # open after 50% of 20 calls fail
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s    # cool down before HALF_OPEN
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      productClient:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Retry ONLY transient infra errors. Never retry 4xx — those are business errors.
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - java.util.concurrent.TimeoutException
  bulkhead:
    instances:
      productClient:
        max-concurrent-calls: 20
        max-wait-duration: 50ms
  timelimiter:
    instances:
      productClient:
        timeout-duration: 3s
        cancel-running-future: true

---
# Profile: docker — overrides for running fully inside docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-user:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true
  kafka:
    bootstrap-servers: kafka:29092

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/