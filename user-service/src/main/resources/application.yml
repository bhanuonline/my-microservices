spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:"   # allow startup even if config-server absent
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8095
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/userdb?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: pass1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    config:
      enabled: false          # config-server not implemented yet — disable client check
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        # Producer binding: <bean-or-bindingName>-out-0
        # Matches StreamBridge.send("userRegistered-out-0", ...) in UserEventPublisher
        userRegistered-out-0:
          destination: user.registered
          content-type: application/json

server:
  port: 8081

# Demo property for @RefreshScope — change this and POST /actuator/refresh
demo:
  greeting: "Hello from the ORIGINAL config"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env,configprops,loggers   # refresh=@RefreshScope reload; loggers=runtime log level change
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    org.hibernate.SQL: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

---
# Profile: docker — overrides for running fully inside docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-user:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true
  kafka:
    bootstrap-servers: kafka:29092

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/