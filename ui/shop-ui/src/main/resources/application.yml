spring:
  application:
    name: shop-ui
  thymeleaf:
    cache: false              # dev-friendly; flip for prod

server:
  port: 8089

shop:
  backends:
    gateway-url: ${GATEWAY_URL:http://localhost:8080}
    product-query-url: ${PRODUCT_QUERY_URL:http://localhost:8088}
    admin-user: ${ADMIN_USER:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

info:
  app:
    name: Shop UI
    description: Thymeleaf + HTMX storefront
    port: ${server.port}

---
spring:
  config:
    activate:
      on-profile: docker
shop:
  backends:
    gateway-url: http://api-gateway:8080
    product-query-url: http://product-query:8088
