<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Products</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h4 mb-0">Products</h1>
        <a th:href="@{/products/new}" class="btn btn-sm btn-primary">
            <i class="bi bi-plus-lg"></i> New product
        </a>
    </div>

    <form class="mb-3 d-flex gap-2 align-items-center" method="get" th:action="@{/products}">
        <input class="form-control form-control-sm" name="q" placeholder="search name/description…"
               th:value="${q}" style="width:18rem"/>
        <input class="form-control form-control-sm" name="category" placeholder="category"
               th:value="${category}" style="width:10rem"/>
        <input class="form-control form-control-sm" name="brand" placeholder="brand"
               th:value="${brand}" style="width:10rem"/>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="inStock" name="inStock" value="true"
                   th:checked="${inStock}"/>
            <label class="form-check-label small" for="inStock">In stock</label>
        </div>
        <button class="btn btn-sm btn-outline-secondary">Apply</button>
        <a th:href="@{/products}" class="small text-muted ms-1">clear</a>
    </form>

    <p class="small text-muted mb-2">
        <span th:text="${results.total()}">0</span> results · page <span th:text="${page + 1}">1</span>
    </p>

    <div class="tile p-0">
        <table class="table ops mb-0">
            <thead class="small text-muted">
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Brand</th>
                    <th class="text-end">Price</th>
                    <th class="text-end">Stock</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${results.items()}">
                    <td><a th:href="@{'/products/' + ${p.id}}" th:text="${p.name}">name</a></td>
                    <td class="small" th:text="${p.category}">—</td>
                    <td class="small" th:text="${p.brand}">—</td>
                    <td class="text-end"
                        th:text="${p.price != null ? '$' + #numbers.formatDecimal(p.price, 1, 2) : '—'}">$0</td>
                    <td class="text-end">
                        <span th:text="${p.stock}" th:classappend="${p.stock != null and p.stock &lt; 10} ? 'text-danger fw-bold'">0</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{'/products/' + ${p.id}}">Edit</a>
                    </td>
                </tr>
                <tr th:if="${results.items().isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-3">No products match.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${results.items().size() == size}">
        <ul class="pagination pagination-sm">
            <li class="page-item" th:classappend="${page == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(q=${q}, category=${category}, brand=${brand}, inStock=${inStock}, page=${page - 1}, size=${size})}">Prev</a>
            </li>
            <li class="page-item active"><span class="page-link" th:text="${page + 1}">1</span></li>
            <li class="page-item">
                <a class="page-link"
                   th:href="@{/products(q=${q}, category=${category}, brand=${brand}, inStock=${inStock}, page=${page + 1}, size=${size})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
