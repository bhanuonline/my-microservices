<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Orders</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h4 mb-0">Orders</h1>
        <a th:href="@{/orders/live}" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-broadcast-pin"></i> Live feed
        </a>
    </div>

    <form class="mb-3 d-flex gap-2 align-items-center" method="get" th:action="@{/orders}">
        <select name="status" class="form-select form-select-sm" style="width:12rem"
                onchange="this.form.submit()">
            <option value="">— all statuses —</option>
            <option value="CREATED"  th:selected="${status == 'CREATED'}">CREATED</option>
            <option value="PAID"     th:selected="${status == 'PAID'}">PAID</option>
            <option value="PENDING"  th:selected="${status == 'PENDING'}">PENDING</option>
            <option value="FAILED"   th:selected="${status == 'FAILED'}">FAILED</option>
            <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">CANCELLED</option>
        </select>
        <input type="number" name="productId" placeholder="filter by productId"
               th:value="${productId}" class="form-control form-control-sm" style="width:12rem"/>
        <button type="submit" class="btn btn-sm btn-outline-secondary">Apply</button>
        <a th:href="@{/orders}" class="small text-muted ms-2">clear</a>
    </form>

    <div class="tile p-0">
        <table class="table ops mb-0">
            <thead class="small text-muted">
                <tr><th>Order id</th><th>Status</th><th>Amount</th><th>Product</th><th>Placed</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="o : ${orders}">
                    <td><code th:text="${o.id}">id</code></td>
                    <td><span class="badge status-badge"
                              th:classappend="|status-${o.status}|"
                              th:text="${o.status}">S</span></td>
                    <td th:text="${o.amount != null ? '$' + o.amount : '—'}">$0</td>
                    <td th:text="${o.productId}">0</td>
                    <td class="text-muted small"
                        th:text="${o.createdAt != null ? #temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{'/orders/' + ${o.id}}">Open</a>
                    </td>
                </tr>
                <tr th:if="${orders.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-3">No orders match.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${orders.size() == size}">
        <ul class="pagination pagination-sm">
            <li class="page-item" th:classappend="${page == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/orders(status=${status}, productId=${productId}, page=${page - 1}, size=${size})}">Prev</a>
            </li>
            <li class="page-item active"><span class="page-link" th:text="${page + 1}">1</span></li>
            <li class="page-item">
                <a class="page-link"
                   th:href="@{/orders(status=${status}, productId=${productId}, page=${page + 1}, size=${size})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
