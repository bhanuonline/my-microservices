spring:
  application:
    name: user-service
  config:
    # `optional:` prefix = boot even if config-server is unreachable, so a
    # dead config-server does not take down user-service. The URI is
    # overridable via env (compose sets CONFIG_SERVER_URI=http://config-server:8888).
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8095
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/userdb?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:pass1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    config:
      # Boot resilience when config-server is slow/down:
      # fail-fast=false     log the error, keep booting with whatever local defaults exist
      # retry.max-attempts  how many times to retry before giving up (per import)
      # The `optional:` prefix on spring.config.import is what actually
      # allows no-config-server boots; these knobs just tune the retry window.
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        # Producer binding: <bean-or-bindingName>-out-0
        # Matches StreamBridge.send("userRegistered-out-0", ...) in UserEventPublisher
        userRegistered-out-0:
          destination: user.registered
          content-type: application/json

server:
  port: 8081

# demo.greeting MOVED to config-repo/user-service.yml. Keep a fallback here
# so a cold boot with config-server unreachable still answers the demo
# endpoint with something recognizable instead of literal "default".
demo:
  greeting: "Hello from LOCAL FALLBACK (config-server unreachable)"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env,configprops,loggers,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  # /actuator/info population — build/git from Maven plugins, java/os built-in
  info:
    env: { enabled: true }
    build: { enabled: true }
    git: { mode: full, enabled: true }
    java: { enabled: true }
    os: { enabled: true }
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

info:
  app:
    name: User Service
    description: User management REST API
    port: ${server.port:8090}

# logging.level and resilience4j blocks MOVED to config-repo/user-service.yml.
# They are tunable live via `/actuator/refresh` from there.

---
# Profile: docker — overrides for running fully inside docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-user:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true
  kafka:
    bootstrap-servers: kafka:29092

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/