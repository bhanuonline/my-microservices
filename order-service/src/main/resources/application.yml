spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8095

  # H2 in-memory: real JPA, zero infra. Data lost on restart — fine for dev/demo.
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Raw Kafka producer — used by OutboxRelay (sends pre-serialized JSON strings).
  # Spring Cloud Stream still handles the saga bindings below; both coexist.
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Transactional producer — OutboxRelay batches N outbox rows into one Kafka
      # transaction. Consumers with isolation.level=read_committed only see the
      # whole batch after commit (never partials on crash).
      # IMPORTANT: in production, suffix the prefix with a per-instance id
      # (${HOSTNAME}, pod name) — two instances sharing the same prefix will fence
      # each other out and alternate going offline.
      # Suffixed with HOSTNAME (pod name in K8s) so parallel instances don't fence
      # each other out. Two producers with the same transactional.id → the newer
      # one wins, the older is zombie-fenced and halts. Interview talking point.
      transaction-id-prefix: ${spring.application.name}-tx-${HOSTNAME:local}-
      acks: all                            # required for exactly-once
      properties:
        enable.idempotence: true           # required alongside transactions
        max.in.flight.requests.per.connection: 5

  cloud:
    config:
      enabled: false          # config-server not implemented yet
    function:
      # All consumer beans wired via Cloud Stream. Semicolon-separated.
      # Old choreography consumers kept for reference.
      definition: paymentCompleted;paymentFailed;paymentReply;notifyUserReply
    stream:
      # In-process retry: 3 attempts with exponential backoff.
      # After that, Kafka binder routes to DLQ.
      default:
        consumer:
          max-attempts: 3
          back-off-initial-interval: 500
          back-off-multiplier: 2.0
          back-off-max-interval: 10000
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          # Skip aborted/in-flight transactional messages — producers now use
          # transaction-id-prefix so committed batches are atomic.
          consumer-properties:
            isolation.level: read_committed
        default:
          consumer:
            enableDlq: true              # poison messages routed to error.<topic>.<group>
            autoCommitOnError: true      # advance past the poisoned offset
            dlqPartitions: 1
            # Raw byte serializers so DLQ send succeeds for deserialization failures.
            dlqProducerProperties:
              configuration:
                key.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
                value.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      bindings:
        # NOTE: order.created is produced via the outbox pattern (OutboxRelay →
        # KafkaTemplate), not Cloud Stream — no binding needed here.
        paymentCompleted-in-0:
          destination: payment.completed
          group: order-service
          content-type: application/json
        paymentFailed-in-0:
          destination: payment.failed
          group: order-service
          content-type: application/json

        # ---- NEW saga orchestration ----
        # Outbound commands (orchestrator → services)
        paymentCommand-out-0:
          destination: payment.commands
          content-type: application/json
        notifyUserCommand-out-0:
          destination: notification.commands
          content-type: application/json
        refundCommand-out-0:
          destination: payment.commands.refund
          content-type: application/json

        # Inbound replies (services → orchestrator)
        paymentReply-in-0:
          destination: payment.replies
          group: order-service-saga
          content-type: application/json
        notifyUserReply-in-0:
          destination: notification.replies
          group: order-service-saga
          content-type: application/json

server:
  port: 8083                     # was 8092 ? moving to 8083 to keep ports sequential

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      productClient:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      productClient:
        max-attempts: 3                    # total attempts (initial + 2 retries)
        wait-duration: 200ms               # base delay between retries
        enable-exponential-backoff: true   # 200ms, 400ms, 800ms, ...
        exponential-backoff-multiplier: 2
        # Only retry on transient network/downstream errors — NOT business exceptions.
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException

  bulkhead:
    instances:
      productClient:
        max-concurrent-calls: 10           # cap concurrent calls to product-service
        max-wait-duration: 100ms           # if all slots busy, wait up to 100ms then fail

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,bulkheadevents,prometheus,metrics,env,loggers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  info:
    env: { enabled: true }
    build: { enabled: true }
    git: { mode: full, enabled: true }
    java: { enabled: true }
    os: { enabled: true }
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

info:
  app:
    name: Order Service
    description: Order lifecycle + saga orchestration
    port: ${server.port:8092}

# HTTP Idempotency-Key — opt in per endpoint. Clients send header
# `Idempotency-Key: <uuid>` on POST /api/v1/orders; a repeat with the same key
# returns the stored response and does NOT create a duplicate order.
idempotency:
  enabled: true
  ttl: 24h
  endpoints:
    - "POST /api/v1/orders"

# Outbox dispatcher mode. When Debezium is running (docker-cdc profile),
# the OutboxRelay polling job is a duplicate — disable it.
outbox:
  polling-enabled: ${OUTBOX_POLLING:true}

# Opt into the common-lib FeatureFlagService + /admin/flags endpoints.
feature-flags:
  enabled: true

# OrderSagaResumer — on boot, re-fires the next command for any saga that
# was in-flight when the service last stopped. Prevents SagaInFlightStuck
# alerts caused by crash/restart (vs. a true broken reply handler).
#
#   enabled      master switch (set to false in tests that need deterministic saga state)
#   stale-after  minimum saga age before we touch it. Guards against racing
#                an in-flight reply still sitting on Kafka.
#   max-batch    upper bound on how many sagas are resumed per boot. Protects
#                Kafka from a thundering-herd of commands after a long outage.
orderservice:
  saga:
    resume:
      enabled: ${SAGA_RESUME_ENABLED:true}
      stale-after: PT30S
      max-batch: 100

---
# Profile `docker-cdc`: Postgres + CDC. Debezium reads outbox_events via WAL
# instead of OutboxRelay polling.
spring:
  config:
    activate:
      on-profile: docker-cdc
  datasource:
    url: jdbc:postgresql://postgres-order:5432/orderdb
    username: order
    password: order
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
outbox:
  polling-enabled: false

# Feign timeouts (defaults are too generous)
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000