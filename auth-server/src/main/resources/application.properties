spring.application.name=authservice
server.port=8095

# Profile switch: inmemory (default, today's behaviour) or jdbc (production-shaped).
# Override at runtime: -Dspring-boot.run.profiles=jdbc
spring.profiles.active=inmemory

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${AUTH_DB_PORT:3309}/authdb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pass1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# DEV ONLY: 'update' auto-creates/updates tables to match entities on every boot.
# NEVER use 'update' in prod — silent schema changes can wreck data.
# Prod: switch to 'validate' + use Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8095

# Basic in?memory user for Spring Security login
spring.security.user.name=${AUTH_UI_USERNAME:admin}
spring.security.user.password=${AUTH_UI_PASSWORD:password}

# Auth log

logging.level.org.springframework.security.oauth2.server.authorization=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=TRACE
logging.level.org.springframework.security.oauth2.provider.endpoint=TRACE

# You?ll see what Spring Security and OAuth2 are doing
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web=INFO

# NOTE: The logging.pattern.console below is superseded by logback-spring.xml
# (added when common-lib is on the classpath). Logstash encoder emits structured
# JSON with traceId + spanId + correlationId as top-level keys.
#logging.pattern.console={"time":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}", "level":"%p", "logger":"%c{1}", "trace":"%X{traceId:-}", "span":"%X{spanId:-}", "message":"%m"}%n

# ─── Observability ────────────────────────────────────────────────────
# Micrometer Tracing → Zipkin (deps already in pom).
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Actuator: expose health, info, prometheus. /actuator/info populated by
# build-info + git-commit-id plugins (see pom) + info.* section below.
management.endpoints.web.exposure.include=health,info,prometheus,metrics,env,loggers
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.mode=full
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

info.app.name=Auth Server
info.app.description=OAuth2 authorization server + admin UI
info.contact.docs=docs/microservices/auth-server-admin/README.md



