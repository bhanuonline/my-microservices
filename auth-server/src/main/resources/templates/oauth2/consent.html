<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Authorize <span th:text="${clientName}">app</span></title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<main class="container" style="max-width: 520px; margin-top: 4rem;">
  <div class="card shadow-sm">
    <div class="card-body p-4">

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div th:unless="${error}">
        <h1 class="h4 mb-3">Authorize this application</h1>
        <p class="text-muted small mb-4">
          Signed in as <strong th:text="${principalName}">user</strong>
        </p>

        <div class="alert alert-info">
          <strong th:text="${clientName}">Client Name</strong>
          <span class="text-muted small">(<code th:text="${clientId}">client_id</code>)</span>
          <br>is requesting access:
        </div>

        <!-- POST back to /oauth2/authorize with the scopes the user actually approved. -->
        <form method="post" th:action="@{/oauth2/authorize}">
          <input type="hidden" name="client_id" th:value="${clientId}">
          <input type="hidden" name="state"     th:value="${state}">

          <div th:each="s : ${scopes}" class="form-check mb-2">
            <input class="form-check-input"
                   type="checkbox"
                   name="scope"
                   th:id="'scope-' + ${s.name}"
                   th:value="${s.name}"
                   th:checked="${s.previouslyGranted}">
            <label class="form-check-label" th:for="'scope-' + ${s.name}">
              <code th:text="${s.name}">scope</code>
              <span class="text-muted"> — <span th:text="${s.description}">desc</span></span>
              <span th:if="${s.previouslyGranted}"
                    class="badge bg-secondary ms-1">previously granted</span>
            </label>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary flex-grow-1">Approve</button>
            <!-- Deny by simply not submitting (or POST empty scope). We omit a deny
                 button here; user clicks browser Back. RFC 6749 says the client
                 should treat missing approval as denial. Real prod: add an
                 explicit Deny button that POSTs to /oauth2/authorize with no scopes. -->
            <a th:href="'about:blank'" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
