<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin — Users</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<div th:replace="~{admin/layout :: nav}"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Users</h1>
    <a class="btn btn-primary" th:href="@{/admin/users/new}">+ New User</a>
  </div>

  <div th:if="${#lists.isEmpty(users)}" class="alert alert-info">
    No users yet.
  </div>

  <table th:unless="${#lists.isEmpty(users)}" class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Roles</th>
        <th>Enabled</th>
        <th style="width: 200px;">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="u : ${users}">
        <td>
          <span th:text="${u.username}"></span>
          <!-- FEATURE 5: lock status -->
          <span th:if="${u.lockedUntil != null and u.lockedUntil.isAfter(T(java.time.Instant).now())}"
                class="badge bg-danger ms-1"
                th:title="'locked until ' + ${u.lockedUntil}">LOCKED</span>
          <span th:if="${u.failedAttempts > 0 and (u.lockedUntil == null or u.lockedUntil.isBefore(T(java.time.Instant).now()))}"
                class="badge bg-warning text-dark ms-1"
                th:text="${u.failedAttempts} + ' fails'"></span>
        </td>
        <td th:text="${u.email}"></td>
        <td>
          <span th:each="r : ${u.roles}"
                class="badge bg-secondary me-1"
                th:text="${r}"></span>
        </td>
        <td>
          <span th:if="${u.enabled}" class="badge bg-success">Yes</span>
          <span th:unless="${u.enabled}" class="badge bg-danger">No</span>
        </td>
        <td>
          <a class="btn btn-sm btn-outline-secondary"
             th:href="@{|/admin/users/${u.id}/edit|}">Edit</a>
          <!-- FEATURE 5: unlock (visible when feature on AND user is currently locked OR has failures) -->
          <form th:if="${features != null and features.accountLockout.enabled
                        and (u.lockedUntil != null or u.failedAttempts > 0)}"
                th:action="@{|/admin/users/${u.id}/unlock|}"
                method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-warning"
                    onclick="return confirm('Clear lockout + failure counter for this user?');">Unlock</button>
          </form>
          <form th:action="@{|/admin/users/${u.id}/delete|}"
                method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-danger"
                    onclick="return confirm('Delete this user?');">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
