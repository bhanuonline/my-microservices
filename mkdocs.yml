# =====================================================================
# MkDocs Material site config.
#
# Generates a searchable, navigable documentation website from the
# existing .md files in docs/microservices/. Source Markdown is
# authoritative — this file just controls theme + nav structure.
#
# Dev:   make docs-serve     → http://localhost:8000  (live reload)
# Build: make docs-build     → ./site/*.html
# Deploy: make docs-deploy   → pushes to gh-pages branch
# =====================================================================

site_name: my-microservices
site_description: Spring Boot microservices playground — e-commerce stack with user, product, order, payment services + saga + observability.
site_author: bhanuonline
site_url: https://bhanuonline.github.io/my-microservices/

repo_name: bhanuonline/my-microservices
repo_url: https://github.com/bhanuonline/my-microservices
edit_uri: edit/main/docs/

# Point MkDocs at the subdirectory where the microservices docs live.
docs_dir: docs/microservices
site_dir: site

# ─── Theme ────────────────────────────────────────────────────────────
theme:
  name: material
  language: en
  features:
    - navigation.instant          # faster page swaps (SPA-like)
    - navigation.tracking         # URL updates as you scroll
    - navigation.tabs             # top-level sections as tabs
    - navigation.tabs.sticky      # tabs stay visible on scroll
    - navigation.sections         # sections render as groups in sidebar
    - navigation.expand           # auto-expand sidebar
    - navigation.top              # back-to-top button
    - navigation.indexes          # section landing pages via README.md
    - search.suggest              # autocomplete in search
    - search.highlight            # highlight hits in page
    - search.share                # shareable search URL
    - content.code.copy           # copy button on code blocks
    - content.code.annotate       # inline code annotations
    - content.tabs.link           # tabs sync across pages
    - toc.follow                  # sidebar TOC scrolls with content
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

# ─── Markdown extensions ──────────────────────────────────────────────
markdown_extensions:
  # Standard
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section

  # pymdownx — power features
  - pymdownx.betterem                # better bold/italic parsing
  - pymdownx.caret                   # superscript via ^^text^^
  - pymdownx.details                 # collapsible blocks
  - pymdownx.highlight:              # syntax highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite            # inline `code` with highlighting
  - pymdownx.keys                    # ++cmd+shift+p++ keyboard keys
  - pymdownx.mark                    # ==highlighted==
  - pymdownx.smartsymbols
  - pymdownx.snippets                # include files
  - pymdownx.superfences:            # nested code + diagrams
      custom_fences:
        - name: mermaid              # renders ```mermaid blocks
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:                 # === "Tab A" / === "Tab B"
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde                   # subscript via ~~text~~

# ─── Plugins ──────────────────────────────────────────────────────────
plugins:
  - search:
      separator: '[\s\-\.\_]+'
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

# ─── Extra ────────────────────────────────────────────────────────────
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bhanuonline/my-microservices
  generator: false                   # hide "Made with Material for MkDocs"

# ─── Navigation ───────────────────────────────────────────────────────
