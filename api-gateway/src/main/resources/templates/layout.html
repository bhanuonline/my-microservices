<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Admin</title>
    <style>
        :root {
            --bg:#f6f7f9; --card:#fff; --text:#1f2933; --muted:#6b7280;
            --border:#e5e7eb; --primary:#2563eb; --primary-hover:#1d4ed8;
            --danger:#dc2626; --success:#059669; --warn:#d97706;
            --code-bg:#f3f4f6;
        }
        * { box-sizing:border-box; }
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
               background:var(--bg); color:var(--text); font-size:14px; }
        a { color:var(--primary); text-decoration:none; }
        a:hover { text-decoration:underline; }
        code { background:var(--code-bg); padding:2px 6px; border-radius:4px;
               font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px; }

        .topbar { background:var(--card); border-bottom:1px solid var(--border);
                  padding:12px 24px; display:flex; align-items:center; gap:24px; }
        .brand { font-weight:600; font-size:15px; }
        .tabs { display:flex; gap:4px; flex:1; }
        .tab { padding:6px 12px; border-radius:6px; color:var(--muted); font-weight:500; }
        .tab:hover { background:var(--code-bg); color:var(--text); text-decoration:none; }
        .tab.active { background:var(--primary); color:#fff; }
        .user { color:var(--muted); font-size:13px; }

        .content { padding:24px; max-width:1200px; width:100%; margin:0 auto; }
        h1 { margin:0 0 20px; font-size:22px; }
        h2 { margin:24px 0 12px; font-size:16px; }

        .flash { padding:10px 14px; border-radius:6px; margin-bottom:16px; font-size:13px; }
        .flash.success { background:rgba(5,150,105,0.08); color:var(--success);
                         border:1px solid rgba(5,150,105,0.25); }
        .flash.error   { background:rgba(220,38,38,0.08); color:var(--danger);
                         border:1px solid rgba(220,38,38,0.25); }
        .flash.warn    { background:rgba(217,119,6,0.08); color:var(--warn);
                         border:1px solid rgba(217,119,6,0.25); }

        table.grid { width:100%; border-collapse:collapse; background:var(--card);
                     border-radius:8px; overflow:hidden;
                     box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:24px; }
        .grid th, .grid td { padding:10px 14px; text-align:left;
                              border-bottom:1px solid var(--border); }
        .grid th { background:var(--code-bg); font-weight:600; font-size:12px;
                    text-transform:uppercase; color:var(--muted); letter-spacing:.03em; }
        .grid tbody tr:last-child td { border-bottom:none; }
        .grid tbody tr:hover { background:rgba(0,0,0,.02); }

        .card { background:var(--card); border:1px solid var(--border);
                border-radius:8px; padding:16px 20px; margin-bottom:24px; }

        form label { display:block; margin-bottom:12px; font-weight:500; }
        input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--border);
                                    border-radius:6px; font-size:14px; font-family:inherit;
                                    background:#fff; color:var(--text); margin-top:4px; }
        textarea { font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
                    font-size:13px; resize:vertical; }
        input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary);
                    box-shadow:0 0 0 3px rgba(37,99,235,.15); }
        input[readonly] { background:var(--code-bg); }

        button, .btn { display:inline-block; cursor:pointer; border:1px solid var(--primary);
                       background:var(--primary); color:#fff; padding:8px 14px;
                       border-radius:6px; font-size:14px; font-weight:500; font-family:inherit; }
        button:hover, .btn:hover { background:var(--primary-hover); border-color:var(--primary-hover);
                                    text-decoration:none; color:#fff; }
        button.secondary, .btn.secondary { background:#fff; color:var(--text); border-color:var(--border); }
        button.secondary:hover, .btn.secondary:hover { background:var(--code-bg); color:var(--text); }
        button.danger, .btn.danger { background:var(--danger); border-color:var(--danger); }
        button.danger:hover, .btn.danger:hover { background:#b91c1c; border-color:#b91c1c; }
        button.linkish { background:transparent; color:var(--primary); border:none; padding:4px 8px; }
        button.linkish:hover { text-decoration:underline; background:transparent; color:var(--primary-hover); }
        button.linkish.danger { color:var(--danger); }

        .actions { display:flex; gap:8px; align-items:center; margin-bottom:16px; }
        .actions form { display:inline-block; margin:0; }
        .row-actions form { display:inline; }

        .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px;
                  font-weight:600; text-transform:uppercase; }
        .badge.action-create  { background:rgba(5,150,105,.12);  color:var(--success); }
        .badge.action-update  { background:rgba(37,99,235,.12);  color:var(--primary); }
        .badge.action-delete  { background:rgba(220,38,38,.12);  color:var(--danger); }
        .badge.action-refresh { background:rgba(107,114,128,.12); color:var(--muted); }
        .badge.outcome-success           { background:rgba(5,150,105,.12); color:var(--success); }
        .badge.outcome-validation_failed { background:rgba(217,119,6,.12); color:var(--warn); }
        .badge.outcome-store_error       { background:rgba(220,38,38,.12); color:var(--danger); }

        .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px; }
        .muted { color:var(--muted); }
        .small { font-size:12px; }
        .empty { padding:16px; text-align:center; color:var(--muted);
                  background:var(--card); border:1px dashed var(--border); border-radius:8px; }
    </style>
</head>

<!-- Reusable top bar fragment -->
<body>
<header th:fragment="topbar(active)" class="topbar">
    <div class="brand">API Gateway Admin <span class="muted small">(Thymeleaf)</span></div>
    <nav class="tabs">
        <a th:href="@{/admin/ui/routes}"  th:classappend="${active == 'routes'  ? 'tab active' : 'tab'}">Routes</a>
        <a th:href="@{/admin/ui/audit}"   th:classappend="${active == 'audit'   ? 'tab active' : 'tab'}">Audit</a>
        <a th:href="@{/admin/ui/apikeys}" th:classappend="${active == 'apikeys' ? 'tab active' : 'tab'}">API Keys</a>
    </nav>
    <div class="user">Signed in via HTTP Basic</div>
</header>
</body>
</html>
