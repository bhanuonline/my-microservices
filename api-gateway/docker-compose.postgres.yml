# Local Postgres for the api-gateway `postgres` Spring profile.
#
# Boot:  docker-compose -f api-gateway/docker-compose.postgres.yml up -d
# Shell: docker exec -it gateway-postgres psql -U gateway -d gateway
# Stop:  docker-compose -f api-gateway/docker-compose.postgres.yml down
# Wipe:  docker-compose -f api-gateway/docker-compose.postgres.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gateway-postgres-data:/var/lib/postgresql/data

volumes:
  gateway-postgres-data:
