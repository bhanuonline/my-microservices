<!DOCTYPE html>
<!--
    Shared app-shell sidebar.

    Include on any page like this:

        <body>
            <div class="app-shell">
                <div th:replace="~{fragments/app-sidebar :: sidebar(active='signals')}"></div>
                <main class="app-main">
                    ... your page content ...
                </main>
            </div>
        </body>

    The `active` parameter tells the sidebar which link should be highlighted.
    Valid values match the data-nav attributes below:
        dashboard | bias | chart | ticker | signals | pipeline | news | instruments

    Depends on:
      • static/css/theme.css (design tokens)
      • static/css/app-shell.css (shell + sidebar styles) — auto-loaded by
        theme-head fragment via a second link tag
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(active)" class="app-side">
    <div class="app-brand">
        <div class="app-logo">A</div>
        <div class="app-brand-name">AngleApp</div>
    </div>

    <!-- All nav links open in a new tab (target="_blank" + rel="noopener" for security). -->
    <nav class="app-nav">
        <a th:href="@{/dashboard}"        target="_blank" rel="noopener" th:classappend="${active == 'dashboard'}   ? 'active' : ''" data-nav="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
                <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
            </svg>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/bias}"             target="_blank" rel="noopener" th:classappend="${active == 'bias'}        ? 'active' : ''" data-nav="bias">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 13 8 13 10 8 14 18 16 13 21 13"/>
            </svg>
            <span>Bias</span>
        </a>
        <a th:href="@{/live/chart}"       target="_blank" rel="noopener" th:classappend="${active == 'chart'}       ? 'active' : ''" data-nav="chart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20V6"/><path d="M4 14l4-4 4 4 4-4 4 4"/><circle cx="20" cy="4" r="1.6" fill="currentColor"/>
            </svg>
            <span>Live Chart</span>
        </a>
        <a th:href="@{/live/ticker}"      target="_blank" rel="noopener" th:classappend="${active == 'ticker'}      ? 'active' : ''" data-nav="ticker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/>
            </svg>
            <span>Live Ticker</span>
        </a>
        <a th:href="@{/live/orb}"         target="_blank" rel="noopener" th:classappend="${active == 'orb'}         ? 'active' : ''" data-nav="orb">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="10" width="4" height="10" rx="1"/>
                <rect x="10" y="4" width="4" height="16" rx="1"/>
                <rect x="17" y="7" width="4" height="13" rx="1"/>
                <path d="M3 7l7-3 7 2 4-2"/>
            </svg>
            <span>ORB Signals</span>
        </a>
        <a th:href="@{/signals}"          target="_blank" rel="noopener" th:classappend="${active == 'signals'}     ? 'active' : ''" data-nav="signals">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2 L4 14 h7 l-1 8 10-13 h-7 z"/>
            </svg>
            <span>Signal Feed</span>
        </a>
        <a th:href="@{/admin/pipeline}"   target="_blank" rel="noopener" th:classappend="${active == 'pipeline'}    ? 'active' : ''" data-nav="pipeline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/>
                <line x1="8" y1="6" x2="16" y2="6"/><line x1="6" y1="8" x2="6" y2="16"/><line x1="18" y1="8" x2="18" y2="16"/><line x1="8" y1="18" x2="16" y2="18"/>
            </svg>
            <span>Pipeline</span>
        </a>
        <a th:href="@{/admin/news}"       target="_blank" rel="noopener" th:classappend="${active == 'news'}        ? 'active' : ''" data-nav="news">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>News Calendar</span>
        </a>
        <a th:href="@{/briefing}"         target="_blank" rel="noopener" th:classappend="${active == 'briefing'}    ? 'active' : ''" data-nav="briefing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <span>Pre-Market Briefing</span>
        </a>
        <a th:href="@{/news}"             target="_blank" rel="noopener" th:classappend="${active == 'newsfeed'}    ? 'active' : ''" data-nav="newsfeed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 22h16a2 2 0 002-2V4a2 2 0 00-2-2H8a2 2 0 00-2 2v16a2 2 0 01-2 2zm0 0a2 2 0 01-2-2v-9c0-1.1.9-2 2-2h2"/>
                <path d="M18 14h-8m0 4h3M18 6h-8"/>
            </svg>
            <span>News Feed</span>
        </a>
        <a th:href="@{/markets}"          target="_blank" rel="noopener" th:classappend="${active == 'markets'}     ? 'active' : ''" data-nav="markets">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 010 20"/><path d="M12 2a15 15 0 000 20"/>
            </svg>
            <span>Global Markets</span>
        </a>
        <a th:href="@{/admin/backtest}"   target="_blank" rel="noopener" th:classappend="${active == 'backtest'}    ? 'active' : ''" data-nav="backtest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/><path d="M7 17l3-6 4 4 4-8"/>
            </svg>
            <span>Backtest</span>
        </a>
        <a th:href="@{/portfolio}"        target="_blank" rel="noopener" th:classappend="${active == 'portfolio'}   ? 'active' : ''" data-nav="portfolio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 6-6"/>
            </svg>
            <span>Portfolio (AI)</span>
        </a>
        <a th:href="@{/admin/instruments}" target="_blank" rel="noopener" th:classappend="${active == 'instruments'} ? 'active' : ''" data-nav="instruments">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="12" width="18" height="4" rx="1"/>
                <line x1="7" y1="4" x2="7" y2="8"/><line x1="17" y1="12" x2="17" y2="16"/>
            </svg>
            <span>Instruments</span>
        </a>
        <a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'active' : ''" data-nav="users">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Users</span>
        </a>
        <a th:href="@{/admin/audit}" th:classappend="${active == 'audit'} ? 'active' : ''" data-nav="audit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2 L20 6 V12 C20 17 16.5 20.7 12 22 C7.5 20.7 4 17 4 12 V6 Z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            <span>Audit Log</span>
        </a>
        <a th:href="@{/account}" th:classappend="${active == 'account'} ? 'active' : ''" data-nav="account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>My account</span>
        </a>
    </nav>

    <div class="app-side-spacer"></div>

    <!-- Theme toggle inline — same pattern as dashboard sidebar. -->
    <div style="padding:0 18px 12px">
        <button type="button" id="sidebarThemeBtn"
                onclick="var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('angle-theme',n);document.getElementById('sidebarThemeBtn').textContent=n==='dark'?'🌙 Dark Theme':'☀️ Light Theme';"
                style="width:100%;padding:10px 12px;font:600 12.5px 'Inter',sans-serif;
                       background:var(--surface);color:var(--ink);
                       border:1px solid var(--border);border-radius:8px;
                       cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">
            ☀️ Light Theme
        </button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('sidebarThemeBtn');
            if (btn) btn.textContent = document.documentElement.dataset.theme === 'dark'
                ? '🌙 Dark Theme'
                : '☀️ Light Theme';
        });
    </script>
</aside>

</body>
</html>
