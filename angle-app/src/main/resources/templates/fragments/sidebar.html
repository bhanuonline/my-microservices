<!DOCTYPE html>
<!--
    Shared sidebar fragment — include on any page with:
       <div th:replace="~{fragments/sidebar :: sidebar('bias')}"></div>
    The argument (e.g. 'bias', 'home', 'dashboard') highlights the current nav item.

    Pages that use this fragment MUST also include fragments/sidebar-styles.html in <head>
    or copy the .side / .navitem CSS so it renders correctly.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="side" th:fragment="sidebar(active)">
    <div class="brand">
        <div class="logo-mark">A</div>
        <div>
            <div class="brand-name">AngleApp</div>
            <div class="brand-sub">personal trading</div>
        </div>
    </div>

    <div class="navlist">
        <a th:class="'navitem' + (${active == 'home'} ? ' active' : '')" th:href="@{/}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12l9-9 9 9"/>
                <path d="M5 10v10h14V10"/>
            </svg>
            <span>Home</span>
        </a>

        <a th:class="'navitem' + (${active == 'bias'} ? ' active' : '')" th:href="@{/bias}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                <rect x="3" y="16" width="7" height="5" rx="1.5"/>
            </svg>
            <span>Bias</span>
        </a>

        <a th:class="'navitem' + (${active == 'dashboard'} ? ' active' : '')" th:href="@{/dashboard}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 3v9l6 3"/>
            </svg>
            <span>Dashboard</span>
        </a>

        <a class="navitem" th:href="@{/api/paper/sessions}" target="_blank">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 13 8 13 10 8 14 18 16 13 21 13"/>
            </svg>
            <span>Sessions</span>
        </a>

        <a class="navitem" th:href="@{/api/reports/today}" target="_blank">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="3" width="16" height="18" rx="2"/>
                <line x1="8" y1="8" x2="16" y2="8"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
                <line x1="8" y1="16" x2="12" y2="16"/>
            </svg>
            <span>Today's Report</span>
        </a>

        <a class="navitem" th:href="@{/api/paper/history}" target="_blank">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7"/>
                <polyline points="3 4 3 10 9 10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="12" x2="15" y2="14"/>
            </svg>
            <span>History</span>
        </a>

        <a class="navitem" th:href="@{/api/instruments/status}" target="_blank">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8v4l3 2"/>
            </svg>
            <span>Instruments</span>
        </a>
    </div>
</aside>

</body>
</html>
