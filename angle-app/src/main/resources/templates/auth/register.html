<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account — Meridian</title>
    <link rel="stylesheet" th:href="@{/js/style.css}">
</head>
<body>
<div class="split-card wide">

    <div class="split-panel">
        <div>
            <div class="split-brand"><span class="dot"></span>Meridian</div>
            <p class="split-tagline">Open a secure account in minutes.</p>
        </div>
        <div class="split-points">
            <div class="split-point">
                <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L20 6 V12 C20 17 16.5 20.7 12 22 C7.5 20.7 4 17 4 12 V6 Z" stroke-linejoin="round"/></svg>
                Bank-grade password encryption
            </div>
            <div class="split-point">
                <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M2.5 20c0-3.5 2.8-5.5 6.5-5.5s6.5 2 6.5 5.5" stroke-linecap="round"/><path d="M16 8.2c1.4.3 2.5 1.4 2.5 3 0 1.3-.7 2.2-1.7 2.7M18.5 20c0-2.6-1-4.3-3-5.1" stroke-linecap="round"/></svg>
                Tiered permissions for traders &amp; admins
            </div>
            <div class="split-point">
                <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
                Full audit trail on every login
            </div>
        </div>
    </div>

    <div class="split-form-side">
        <div class="wrap">
            <h1>Create your account</h1>
            <p class="subtitle">Passwords are hashed with BCrypt before they ever touch the database.</p>

            <div class="error" th:if="${error}" th:text="${error}">Username already taken.</div>

            <form th:action="@{/auth/register}" method="post" id="registerForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <div class="field">
                        <label for="fullName">Full name</label>
                        <input type="text" id="fullName" name="fullName" th:value="${fullName}"
                               required autofocus autocomplete="name">
                    </div>
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" th:value="${username}"
                               required autocomplete="username">
                    </div>
                </div>

                <div class="form-row">
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" th:value="${email}"
                               required autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" name="phone" th:value="${phone}"
                               placeholder="For SMS verification" autocomplete="tel">
                    </div>
                </div>

                <div class="form-row">
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <input type="password" id="password" name="password"
                                   required autocomplete="new-password" minlength="8">
                            <button type="button" class="toggle" data-target="password">Show</button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirm</label>
                        <div class="password-wrap">
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   required autocomplete="new-password" minlength="8">
                            <button type="button" class="toggle" data-target="confirmPassword">Show</button>
                        </div>
                    </div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="submit">Create account</button>
            </form>

            <div class="link-row">
                Already have an account? <a th:href="@{/auth/login}">Sign in</a>
            </div>
        </div>
    </div>

</div><!-- /.split-card -->

<script th:src="@{/js/app.js}"></script>
</body>
</html>
