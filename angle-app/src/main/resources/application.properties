# -------- Options strike suggestion (3-factor: confidence + VIX + expiry) --------
#
# Notation:
#   +offset → OTM (cheaper, more delta risk)
#    0      → ATM  (balanced)
#   -offset → ITM  (safer, higher premium)
#
trading.options.strike-interval=100

# Expiry: pick the listed expiry closest to N days from today.
# 60 = ~2 months out (safer for learning — less theta pressure).
trading.options.preferred-days-to-expiry=60

# If nearest available expiry is ≤ this many days, force ITM (theta kill zone).
trading.options.near-expiry-days=1
trading.options.near-expiry-itm-offset=-100

# CALM VIX (<13): premiums cheap → buy quality (ATM)
trading.options.calm-strong-offset=0
trading.options.calm-moderate-offset=0
trading.options.calm-weak-offset=50

# NORMAL VIX (13-18): balanced
trading.options.normal-strong-offset=0
trading.options.normal-moderate-offset=50
trading.options.normal-weak-offset=100

# ELEVATED VIX (>18): premiums inflated → go further OTM (cheaper for the same move)
trading.options.elevated-strong-offset=0
trading.options.elevated-moderate-offset=100
trading.options.elevated-weak-offset=200