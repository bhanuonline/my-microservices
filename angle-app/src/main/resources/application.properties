server.port=9010
spring.application.name=angle-app

#Spring Security
#logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.angle.trading=DEBUG

#Logging
spring.output.ansi.enabled=ALWAYS

# =====================================================
# Broker configuration
# Secrets come from environment variables. Never commit real keys.
# Example: export ANGEL_API_KEY=xxxx before starting the app.
# =====================================================

# --- Angel One (SmartAPI) ---
broker.angel.enabled=true
broker.angel.base-url=https://apiconnect.angelone.in
broker.angel.api-key=jFupc2Hs
broker.angel.client-code=B324101
broker.angel.password=6598
broker.angel.totp-secret=UPJJGZM2OVB76KZP2DUKRGXVQI

# --- Upstox ---
broker.upstox.enabled=false
broker.upstox.base-url=https://api.upstox.com/v2
broker.upstox.api-key=${UPSTOX_API_KEY:}
broker.upstox.api-secret=${UPSTOX_API_SECRET:}
broker.upstox.redirect-uri=${UPSTOX_REDIRECT_URI:}

# --- Kite (Zerodha) ---
broker.kite.enabled=false
broker.kite.base-url=https://api.kite.trade
broker.kite.api-key=${KITE_API_KEY:}
broker.kite.api-secret=${KITE_API_SECRET:}

# =====================================================
# Analysis configuration
# =====================================================
analysis.nifty.data-file=classpath:nifty/nifty-daily-candles.csv
analysis.strategy.default-strategy=moving-average-crossover
analysis.strategy.sma.short-period=20
analysis.strategy.sma.long-period=50
analysis.strategy.rsi.period=14
analysis.strategy.rsi.oversold=30
analysis.strategy.rsi.overbought=70
analysis.strategy.macd.fast-period=12
analysis.strategy.macd.slow-period=26
analysis.strategy.macd.signal-period=9
analysis.strategy.ensemble.min-agreement=2

# SMC — smart money concepts
analysis.smc.swing.lookback=3
analysis.smc.sweep.window-candles=10

# =====================================================
# Paper trading — auto-start sessions on boot
# =====================================================
paper.autostart.enabled=false
