server.port=9010
spring.application.name=angle-app

# =====================================================
# Database — MySQL (paper trading persistence)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/angleapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:pass1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate create/update schema (fine for dev; use Flyway for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Spring Security
#logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.angle.trading=DEBUG

#Logging
spring.output.ansi.enabled=ALWAYS

# =====================================================
# Broker configuration
# Secrets come from environment variables. Never commit real keys.
# Example: export ANGEL_API_KEY=xxxx before starting the app.
# =====================================================

# --- Angel One (SmartAPI) ---
broker.angel.enabled=true
broker.angel.base-url=https://apiconnect.angelone.in
broker.angel.api-key=jFupc2Hs
broker.angel.client-code=B324101
broker.angel.password=6598
broker.angel.totp-secret=UPJJGZM2OVB76KZP2DUKRGXVQI

# --- Upstox ---
broker.upstox.enabled=false
broker.upstox.base-url=https://api.upstox.com/v2
broker.upstox.api-key=${UPSTOX_API_KEY:}
broker.upstox.api-secret=${UPSTOX_API_SECRET:}
broker.upstox.redirect-uri=${UPSTOX_REDIRECT_URI:}

# --- Kite (Zerodha) ---
broker.kite.enabled=false
broker.kite.base-url=https://api.kite.trade
broker.kite.api-key=${KITE_API_KEY:}
broker.kite.api-secret=${KITE_API_SECRET:}

# =====================================================
# Analysis configuration
# =====================================================
analysis.nifty.data-file=classpath:nifty/nifty-daily-candles.csv
analysis.strategy.default-strategy=moving-average-crossover
analysis.strategy.sma.short-period=20
analysis.strategy.sma.long-period=50
analysis.strategy.rsi.period=14
analysis.strategy.rsi.oversold=30
analysis.strategy.rsi.overbought=70
analysis.strategy.macd.fast-period=12
analysis.strategy.macd.slow-period=26
analysis.strategy.macd.signal-period=9
analysis.strategy.ensemble.min-agreement=2

# SMC — smart money concepts
analysis.smc.swing.lookback=3
analysis.smc.sweep.window-candles=10

# =====================================================
# Alerts — independent on/off per channel
# =====================================================
alerts.enabled=false
alerts.on-trade-open=true
alerts.on-trade-close=true
alerts.on-session-end=true
alerts.on-errors=true

# --- Telegram ---
alerts.telegram.enabled=false
alerts.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
alerts.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# --- WhatsApp (CallMeBot) ---
alerts.whatsapp.enabled=false
alerts.whatsapp.phone=${WHATSAPP_PHONE:}
alerts.whatsapp.api-key=${WHATSAPP_API_KEY:}

# =====================================================
# Daily analysis report
# Writes a Markdown file per trading day to reports/YYYY-MM-DD.md
# =====================================================
reports.enabled=true
reports.output-dir=reports
reports.auto-write-at-close=true
reports.close-cron=0 35 15 * * MON-FRI

# =====================================================
# Paper trading — auto-start sessions on boot
# =====================================================
paper.autostart.enabled=false
# Example: uncomment the block below and set enabled=true to auto-run a live Nifty session
