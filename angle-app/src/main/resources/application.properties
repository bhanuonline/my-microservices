server.port=9010
spring.application.name=angle-app

# =====================================================
# Database — MySQL (paper trading persistence)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/angleapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:pass1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate create/update schema (fine for dev; use Flyway for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Spring Security
#logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.angle.trading=DEBUG

#Logging
spring.output.ansi.enabled=ALWAYS

# =====================================================
# Broker configuration
# Secrets come from environment variables. Never commit real keys.
# Example: export ANGEL_API_KEY=xxxx before starting the app.
# =====================================================

# --- Angel One (SmartAPI) ---
broker.angel.enabled=true
broker.angel.base-url=https://apiconnect.angelone.in
broker.angel.api-key=jFupc2Hs
broker.angel.client-code=B324101
broker.angel.password=6598
broker.angel.totp-secret=UPJJGZM2OVB76KZP2DUKRGXVQI

# --- Upstox ---
broker.upstox.enabled=false
broker.upstox.base-url=https://api.upstox.com/v2
broker.upstox.api-key=${UPSTOX_API_KEY:}
broker.upstox.api-secret=${UPSTOX_API_SECRET:}
broker.upstox.redirect-uri=${UPSTOX_REDIRECT_URI:}

# --- Kite (Zerodha) ---
broker.kite.enabled=false
broker.kite.base-url=https://api.kite.trade
broker.kite.api-key=${KITE_API_KEY:}
broker.kite.api-secret=${KITE_API_SECRET:}

# =====================================================
# Analysis configuration
# =====================================================
analysis.nifty.data-file=classpath:nifty/nifty-daily-candles.csv
analysis.strategy.default-strategy=moving-average-crossover
analysis.strategy.sma.short-period=20
analysis.strategy.sma.long-period=50
analysis.strategy.rsi.period=14
analysis.strategy.rsi.oversold=30
analysis.strategy.rsi.overbought=70
analysis.strategy.macd.fast-period=12
analysis.strategy.macd.slow-period=26
analysis.strategy.macd.signal-period=9
analysis.strategy.ensemble.min-agreement=2

# SMC — smart money concepts
analysis.smc.swing.lookback=3
analysis.smc.sweep.window-candles=10

# =====================================================
# Alerts — independent on/off per channel
# =====================================================
alerts.enabled=false
alerts.on-trade-open=true
alerts.on-trade-close=true
alerts.on-session-end=true
alerts.on-errors=true

# --- Telegram ---
alerts.telegram.enabled=false
alerts.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
alerts.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# --- WhatsApp (CallMeBot) ---
alerts.whatsapp.enabled=false
alerts.whatsapp.phone=${WHATSAPP_PHONE:}
alerts.whatsapp.api-key=${WHATSAPP_API_KEY:}

# =====================================================
# Bias dashboard — /bias page + change alerts
# =====================================================
bias.enabled=true
bias.refresh-minutes=15
bias.lookback-days=90
bias.url-path=/bias

# Instruments to track — one button per entry in the dashboard nav strip.

# Nifty 50 (NSE index)
bias.instruments[0].symbol=Nifty 50
bias.instruments[0].broker=ANGEL
bias.instruments[0].exchange=NSE
bias.instruments[0].symbol-token=99926000
bias.instruments[0].intraday-interval=FIVE_MINUTE

# Bank Nifty (NSE index)
bias.instruments[1].symbol=Bank Nifty
bias.instruments[1].broker=ANGEL
bias.instruments[1].exchange=NSE
bias.instruments[1].symbol-token=99926009
bias.instruments[1].intraday-interval=FIVE_MINUTE

# Reliance (NSE equity)
bias.instruments[2].symbol=Reliance
bias.instruments[2].broker=ANGEL
bias.instruments[2].exchange=NSE
bias.instruments[2].symbol-token=2885
bias.instruments[2].intraday-interval=FIVE_MINUTE

# HDFC Bank (NSE equity)
bias.instruments[3].symbol=HDFC Bank
bias.instruments[3].broker=ANGEL
bias.instruments[3].exchange=NSE
bias.instruments[3].symbol-token=1333
bias.instruments[3].intraday-interval=FIVE_MINUTE

# Crude Oil — MCX front-month
# UPDATE symbol-token each month: curl "http://localhost:9010/api/instruments/futures?underlying=CRUDEOIL" | jq '.[0].token'
bias.instruments[4].symbol=Crude Oil
bias.instruments[4].broker=ANGEL
bias.instruments[4].exchange=MCX
bias.instruments[4].symbol-token=569900
bias.instruments[4].intraday-interval=FIVE_MINUTE

# Gold — MCX front-month (UPDATE TOKEN each 2 months)
#bias.instruments[5].symbol=Gold
#bias.instruments[5].broker=ANGEL
#bias.instruments[5].exchange=MCX
#bias.instruments[5].symbol-token=REPLACE_WITH_CURRENT_TOKEN
#bias.instruments[5].intraday-interval=FIFTEEN_MINUTE

# Timeframes used for the multi-TF bias section (top → bottom)
bias.timeframes[0]=ONE_DAY
bias.timeframes[1]=ONE_HOUR
bias.timeframes[2]=FIFTEEN_MINUTE
bias.timeframes[3]=FIVE_MINUTE

# Consolidated-score thresholds
bias.scoring.strong-threshold=5
bias.scoring.moderate-threshold=3
bias.scoring.weak-threshold=1

# Change-detection alerts (uses AlertService — Telegram/WhatsApp/etc.)
bias.change-alerts.enabled=true
bias.change-alerts.on-bias-flip=true
bias.change-alerts.on-score-jump=true
bias.change-alerts.score-jump-threshold=2
bias.change-alerts.on-new-structural-event=true
bias.change-alerts.on-new-sweep=true
bias.change-alerts.on-adx-cross=true
bias.change-alerts.on-divergence=true
bias.change-alerts.on-vix-spike=true
bias.change-alerts.on-breadth-flip=true

# India VIX
bias.vix.enabled=true
bias.vix.symbol-token=99919011
bias.vix.exchange=NSE
bias.vix.spike-threshold=18.0
bias.vix.calm-threshold=13.0

# Cross-market parallel (Bank Nifty by default)
bias.correlated.enabled=true
bias.correlated.symbol=Bank Nifty
bias.correlated.broker=ANGEL
bias.correlated.exchange=NSE
bias.correlated.symbol-token=99926009
bias.correlated.divergence-percent-threshold=0.15

# Advance/Decline breadth — populate constituent-tokens with your basket.
# Empty list = breadth section disabled.
bias.breadth.enabled=true
bias.breadth.broker=ANGEL
bias.breadth.exchange=NSE
bias.breadth.label=Nifty 50 breadth
bias.breadth.bullish-ratio=2.0
bias.breadth.bearish-ratio=0.5

# Nifty 50 constituent tokens (verify with your scrip master — some may have rotated).
# Add all 50 for a full breadth read; fewer = smaller sample size.
bias.breadth.constituent-tokens[0]=2885
bias.breadth.constituent-tokens[1]=1333
bias.breadth.constituent-tokens[2]=11536
bias.breadth.constituent-tokens[3]=1594
bias.breadth.constituent-tokens[4]=1922
bias.breadth.constituent-tokens[5]=3045
bias.breadth.constituent-tokens[6]=4963
bias.breadth.constituent-tokens[7]=1660
bias.breadth.constituent-tokens[8]=910
bias.breadth.constituent-tokens[9]=3499

# =====================================================
# Daily analysis report
# Writes a Markdown file per trading day to reports/YYYY-MM-DD.md
# =====================================================
reports.enabled=true
reports.output-dir=reports
reports.auto-write-at-close=true
reports.close-cron=0 35 15 * * MON-FRI

# =====================================================
# Paper trading — auto-start sessions on boot
# =====================================================
paper.autostart.enabled=false
