# =====================================================
# Pluggable candle cache
# provider = caffeine  → in-JVM L1 only (fast, cache lost on restart)  ← DEFAULT
# provider = noop      → cache OFF (every request hits broker — for debugging)
# provider = redis     → external L2 only (restart-safe, needs Redis server)
# provider = layered   → L1 Caffeine + L2 Redis (fast + persistent)
# provider = mysql          → L3 MySQL only (durable, range-aware)
# provider = caffeine-mysql → L1 Caffeine + L3 MySQL (fast + persistent, NO Redis needed) ← try this
# provider = redis-mysql    → L2 Redis + L3 MySQL (no in-JVM cache — for multi-instance)
# provider = layered3       → L1 Caffeine + L2 Redis + L3 MySQL (full stack)
# =====================================================
bias.cache.provider=redis-mysql
bias.cache.ttl-seconds=60
bias.cache.max-size=500
bias.cache.stats-log-minutes=15

# Redis (used only when provider = redis or layered / layered3).
# Start Redis locally: docker run -p 6379:6379 -d redis:7
bias.cache.redis.ttl-seconds=300
bias.cache.redis.key-prefix=candles
spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.password=

# MySQL persistent store (used only when provider = mysql or layered3).
# Table candle_history is auto-created by Hibernate on first boot.
bias.cache.mysql.async-pool-size=2
bias.cache.mysql.batch-size=500
bias.cache.mysql.retention-days=365
bias.cache.mysql.purge-cron=0 0 3 * * ?
bias.cache.mysql.retention-enabled=true

# To see every HIT/MISS/FILL, uncomment the line below (verbose but great for debugging).
#logging.level.com.angle.trading.cache=DEBUG

# =====================================================
# Background cache warmer (Phase C)
# Pre-fetches every instrument on a schedule → user's first click is instant.
# Cron gate: only during market hours (Mon-Fri 09:00-15:00 IST) — no wasted Angel calls at night/weekends.
# =====================================================
bias.warmer.enabled=true
bias.warmer.cron=0 */5 9-15 * * MON-FRI
bias.warmer.zone=Asia/Kolkata
bias.warmer.warm-on-startup=true
bias.warmer.parallel-enabled=true
bias.warmer.thread-pool-size=10
bias.warmer.timeout-seconds=60
# Priority tokens — warmed FIRST (stage 1). Others follow in stage 2.
# Guarantees your main instruments are hot even if the round times out.
# Comma-separated symbol tokens. Empty = all instruments in one batch.
bias.warmer.priority-tokens=99926000,99926009

# Circuit breaker — auto-pause warmer when Angel is broken.
# After N consecutive fully-failed rounds → OPEN → skip for cooldownMinutes.
# Then HALF_OPEN (one trial round) → CLOSED on success, OPEN again on failure.
# Reset manually: POST /admin/warmer/circuit/reset
# Bypass for one warm: POST /admin/cache/candles/warm?force=true
bias.warmer.circuit.enabled=true
bias.warmer.circuit.failure-threshold=3
bias.warmer.circuit.cooldown-minutes=15

