# =====================================================
# Dev profile — overrides tuned for local iteration.
#
# Activate with: --spring.profiles.active=dev
#   or set env:  SPRING_PROFILES_ACTIVE=dev
#   or in IDE:   Program args / Env vars panel
#
# Spring loads this ON TOP of application.properties, so only the
# keys below are overridden — everything else stays the same.
# =====================================================

# Templates auto-reload on every HTTP request. Edit any .html under
# src/main/resources/templates, save, refresh browser — new HTML served.
# No app restart needed.
spring.thymeleaf.cache=false

# Static resources (CSS/JS/images under src/main/resources/static) — same deal.
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Verbose SQL logging in dev (uncomment if you want it).
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# logging.level.org.hibernate.SQL=DEBUG
