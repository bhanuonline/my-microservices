# =====================================================================
# Builds and deploys the MkDocs Material site to GitHub Pages whenever
# anything under docs/microservices/ (or related configs) changes on
# main. First-time: Settings → Pages → source = "GitHub Actions".
# =====================================================================

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/microservices/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-revision-date-localized plugin needs history

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install docs deps
        run: pip install -r requirements-docs.txt

      - name: Build site
        # Not --strict yet — anchor-link warnings from older docs.
        run: mkdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
