spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    function:
      definition: orderCreated;paymentCommand;refundCommand
    stream:
      # Cloud Stream retry (in-process, before DLQ kicks in)
      default:
        consumer:
          max-attempts: 3                        # try up to 3 times
          back-off-initial-interval: 500         # 500ms base delay
          back-off-multiplier: 2.0               # 500ms → 1000ms → 2000ms
          back-off-max-interval: 10000
          # After all attempts fail, the message is passed to the binder's
          # DLQ handler (Kafka binder — see kafka.default.consumer below).
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          # Skip aborted/in-flight transactional messages (producers now use
          # transaction-id-prefix). Only committed batches become visible.
          consumer-properties:
            isolation.level: read_committed
        # Defaults for every Kafka consumer in this app.
        default:
          consumer:
            enableDlq: true                      # routes poison messages to error.<topic>.<group>
            dlqName: ""                          # empty = Cloud Stream default naming
            autoCommitOnError: true              # commit offset for failed msg (else infinite loop)
            dlqPartitions: 1                     # single-partition DLQ is fine for demo
            # Raw byte serializers so DLQ send succeeds for deserialization failures.
            dlqProducerProperties:
              configuration:
                key.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
                value.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      bindings:
        # ---- Old choreography ----
        orderCreated-in-0:
          destination: order.created
          group: payment-service
          content-type: application/json
        paymentCompleted-out-0:
          destination: payment.completed
          content-type: application/json
        paymentFailed-out-0:
          destination: payment.failed
          content-type: application/json

        # ---- Saga command handlers ----
        paymentCommand-in-0:
          destination: payment.commands
          group: payment-service
          content-type: application/json
        refundCommand-in-0:
          destination: payment.commands.refund
          group: payment-service
          content-type: application/json
        paymentReply-out-0:
          destination: payment.replies
          content-type: application/json

server:
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

# ─── Payment provider configuration ───────────────────────────────────────
# Default provider when a PaymentCommand does not specify one. Used both by
# PaymentCommandProcessor dispatch and by Mock-vs-Real selection in tests.
payment:
  default-provider: ${PAYMENT_DEFAULT_PROVIDER:mock}
  currency: ${PAYMENT_CURRENCY:INR}
  # Mock provider — rule-based success/decline. The thresholds let F2/F3
  # Postman flows trigger specific failure modes deterministically.
  mock:
    # Amount strictly LESS than this → AUTHORIZED → CAPTURED
    success-below: 50000
    # Amount strictly LESS than this but >= success-below → DECLINED (fraud rule)
    decline-above: 100000
    # Simulate async: how long after INITIATED to emit the webhook event.
    webhook-delay: PT0S
  # Public base URL where providers' webhooks arrive. Behind ngrok/stripe-cli
  # in local dev. Payment-service exposes POST /webhooks/{provider}.
  webhook-base-url: ${PAYMENT_WEBHOOK_BASE_URL:http://localhost:8091}
  # Where providers redirect the user back to after they pay. The shop-ui
  # (or an API client) owns these URLs.
  default-return-url: ${PAYMENT_RETURN_URL:http://localhost:3001/checkout/success}
  default-cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:3001/checkout/cancel}

---
# Profile `docker`: use mysql-payment container instead of in-memory H2.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-payment:3306/paymentdb?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:pass1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
