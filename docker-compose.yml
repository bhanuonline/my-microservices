version: '3.8'

# =====================================================================
# BASE compose file. Three topology modes + mix-and-match profiles.
#
# Topology (pick one):
#   docker compose up                   → minimal   (no COMPOSE_PROFILES)
#     ~11 containers. Just the core: 1 MySQL (shared), Kafka, Eureka,
#     config-server, auth-server, api-gateway, user/product/order-service,
#     Prometheus, Grafana.
#
#   make up          (= make up-shared) → shared-db (COMPOSE_PROFILES=full)
#     Minimal + ALL optional services. ~25 containers.
#
#   make up-individual                  → shared-db + 4 per-service MySQLs
#     via docker-compose.topology-individual.yml. ~29 containers.
#
# Mix-and-match profiles (ADD only what you need):
#
#   core-plus    notification, resource-server       (adds ~250 MB)
#   email        mailhog                             (adds ~20 MB)
#   tracing      zipkin                              (adds ~150 MB)
#   logs         loki, promtail                      (adds ~200 MB)
#   kafka-ops    kafka-ui, kafka-exporter            (adds ~250 MB)
#   search       elasticsearch                       (adds ~1 GB  !!!)
#   cdc          postgres-order, kafka-connect       (adds ~700 MB)
#   avro         schema-registry                     (adds ~300 MB)
#   cache        redis                               (adds ~30 MB)
#   secrets      vault-dev                           (adds ~50 MB)
#   loadtest     k6                                  (one-shot runner)
#   full         everything above EXCEPT loadtest    (shared-db default)
#
# Examples:
#   # "I want saga F1-F3 to work with email alerts" — ~2.5 GB total
#   COMPOSE_PROFILES=core-plus,email docker compose up -d
#
#   # "I want distributed tracing"
#   COMPOSE_PROFILES=core-plus,tracing docker compose up -d
#
#   # "I'm debugging a Kafka topic + want DLQ UI"
#   COMPOSE_PROFILES=core-plus,kafka-ops docker compose up -d
#
# Resource budget (per container, enforced by mem_limit):
#   Spring services:   384-512m   (JVM heap capped via JAVA_TOOL_OPTIONS)
#   kafka:             1g         (-Xmx512m)
#   mysql-shared:      768m       (--innodb-buffer-pool-size=256M)
#   elasticsearch:     1g         (-Xmx384m, down from 512m)
#   others:            as-needed
#
# Total RAM budget by mode (approx, idle):
#   minimal                 : ~2.5 GB
#   core-plus,email,tracing : ~3.2 GB
#   full (shared-db)        : ~5.5 GB
#   individual              : ~6.5 GB
# =====================================================================

services:
  # ---------- Shared database (default) ----------
  mysql-shared:
    image: mysql:8
    container_name: mysql-shared
    environment:
      MYSQL_DATABASE: userdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    # Cap InnoDB buffer pool so MySQL doesn't eat 1+ GB on an idle laptop.
    # 256 MB is plenty for a learning project's row counts.
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
      - --performance-schema=OFF
    mem_limit: 768m
    ports:
      - "3306:3306"
    volumes:
      - ./init-shared-db:/docker-entrypoint-initdb.d:ro
      - mysql-shared-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Messaging (core) ----------
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    # Cap Kafka JVM heap. Default 1 GB is wasteful for local dev.
    mem_limit: 1g
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx512m
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 45s

  # ---------- Observability (core) ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    mem_limit: 384m
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Retention reduced from 7d → 24h for local-dev savings (~200 MB).
      - '--storage.tsdb.retention.time=24h'
      - '--storage.tsdb.retention.size=512MB'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    mem_limit: 384m
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics,traceToLogs
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GF_LOG_LEVEL: warn
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailhog:1025
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM:-grafana@localhost}
      GF_SMTP_FROM_NAME: Grafana Alerts
      GF_SMTP_SKIP_VERIFY: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - backend

  # ---------- Core infrastructure ----------
  eureka-server:
    build:
      context: .
      dockerfile: infra/eureka-server/Dockerfile
    container_name: eureka-server
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    ports:
      - "8761:8761"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    container_name: config-server
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      CONFIG_SERVER_SEARCH_LOCATIONS: file:///config-repo
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  auth-server:
    build:
      context: .
      dockerfile: infra/auth-server/Dockerfile
    container_name: auth-server
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL:-jdbc:mysql://mysql-shared:3306/authdb?useSSL=false}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:8095
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8095:8095"
    depends_on:
      mysql-shared:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8095/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api-gateway:
    build:
      context: .
      dockerfile: infra/api-gateway/Dockerfile
    container_name: api-gateway
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:8095
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - backend

  # ---------- Domain services (core) ----------
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:8095
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      CONFIG_SERVER_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${USER_DB_URL:-jdbc:mysql://mysql-shared:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true}
    ports:
      - "8081:8081"
    depends_on:
      mysql-shared:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:8095
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      CONFIG_SERVER_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: ${PRODUCT_DB_URL:-jdbc:mysql://mysql-shared:3306/productdb?useSSL=false&allowPublicKeyRetrieval=true}
    ports:
      - "8082:8082"
    depends_on:
      mysql-shared:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:8095
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      CONFIG_SERVER_URI: http://config-server:8888
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_started
      config-server:
        condition: service_healthy
    networks:
      - backend

  # ============================================================================
  # Below here: OPT-IN services. Tag with a specific profile so you can mix.
  # `full` = union of ALL profiles below (except loadtest).
  # ============================================================================

  # ---------- "core-plus": brings headline saga flows (F1-F3) to full green --
  # notification + resource-server. Without these, saga reaches PAID but not
  # NOTIFIED. Only ~250 MB combined.

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: notification
    profiles: ["full", "core-plus"]
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseSerialGC"
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8099:8099"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  resource-server:
    build:
      context: .
      dockerfile: infra/resource-server/Dockerfile
    container_name: resource-server
    profiles: ["full", "core-plus"]
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseSerialGC"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:8095
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8096:8096"
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - backend

  # ---------- "email": catches Grafana alert emails ------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    profiles: ["full", "email"]
    mem_limit: 64m
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend

  # ---------- "tracing": distributed traces across services ----------------
  zipkin:
    image: openzipkin/zipkin-slim
    container_name: zipkin
    profiles: ["full", "tracing"]
    mem_limit: 384m
    ports:
      - "9411:9411"
    networks:
      - backend

  # ---------- "logs": log aggregation via Loki + Promtail ------------------
  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    profiles: ["full", "logs"]
    mem_limit: 256m
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    profiles: ["full", "logs"]
    mem_limit: 128m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend

  # ---------- "kafka-ops": browse topics + lag metrics ---------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    profiles: ["full", "kafka-ops"]
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      AUTH_TYPE: DISABLED
    networks:
      - backend

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter
    profiles: ["full", "kafka-ops"]
    mem_limit: 128m
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - '--kafka.server=kafka:29092'
      - '--web.listen-address=:9308'
      - '--kafka.version=3.7.0'
    ports:
      - "9308:9308"
    networks:
      - backend

  # ---------- "search": CQRS read store (ES is heavy — 1 GB) --------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    profiles: ["full", "search"]
    # ES is a known hog. Cap aggressively for local dev.
    mem_limit: 1g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Down from 512m to 384m — ES heap, not container RAM.
      - ES_JAVA_OPTS=-Xms256m -Xmx384m
    ports:
      - "9200:9200"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------- "avro": schema registry --------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    profiles: ["full", "avro"]
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - backend

  # ---------- "cdc": Debezium Postgres → Kafka Connect ---------------------
  postgres-order:
    image: debezium/postgres:15
    container_name: postgres-order
    profiles: ["full", "cdc"]
    mem_limit: 256m
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5433:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-connect:
    image: debezium/connect:2.7
    container_name: kafka-connect
    profiles: ["full", "cdc"]
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
    ports:
      - "8084:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      GROUP_ID: order-cdc-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    networks:
      - backend

  # ---------- "cache": Redis -----------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["full", "cache"]
    mem_limit: 128m
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- "secrets": Vault dev mode ------------------------------------
  vault-dev:
    image: hashicorp/vault:1.15
    container_name: vault-dev
    profiles: ["full", "secrets"]
    mem_limit: 128m
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- "loadtest": k6 one-shot runner -------------------------------
  k6:
    image: grafana/k6:0.52.0
    container_name: k6
    profiles: ["loadtest"]
    mem_limit: 256m
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      BASE_URL: http://api-gateway:8080
      AUTH: admin:admin123
      PRODUCT_IDS: "1,2,3"
    volumes:
      - ./load-tests/k6:/scripts:ro
    entrypoint: ["k6"]
    command: ["run", "--out", "experimental-prometheus-rw", "/scripts/orders.js"]
    networks:
      - backend

  # ---------- Payment service (core) ----------
  # Carries all 5 provider integrations (Mock, Stripe, Razorpay, PayPal,
  # Checkout.com). H2 by default; `docker` profile switches to MySQL.
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:8095
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      CONFIG_SERVER_URI: http://config-server:8888
      PAYMENT_DB_URL: ${PAYMENT_DB_URL:-jdbc:mysql://mysql-shared:3306/paymentdb?useSSL=false&allowPublicKeyRetrieval=true}
    ports:
      - "8091:8091"
    depends_on:
      mysql-shared:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql-shared-data:
    driver: local
