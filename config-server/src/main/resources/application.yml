spring:  application:    name: config-server  profiles:    active: native            # "native" = read from filesystem (not git)  cloud:    config:      server:        native:          # Where the yml files live. Points at a folder we'll create next.          search-locations: file:///${user.home}/config-repo/server:  port: 8888                  # standard config-server porteureka:  client:    service-url:      defaultZone: http://localhost:8761/eureka/  instance:    prefer-ip-address: true