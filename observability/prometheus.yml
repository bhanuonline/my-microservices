global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: my-microservices

scrape_configs:
  - job_name: 'microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'auth-server:8095'
          - 'resource-server:8096'
          - 'user-service:8081'
          - 'product-service:8082'
          - 'order-service:8083'
          - 'order-query:8086'       # Tier 2 CQRS read side
          - 'graphql-bff:8087'       # Tier 4 BFF
          - 'product-query:8088'     # Phase 7 — exposes product_search_* custom metrics
        labels:
          stack: 'my-microservices'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # kafka-exporter — consumer group lag + per-topic offsets, queried from
  # Kafka admin API (works even when consumer services are down).
  # Kept in its own job so labels stay clean (no `application=` tag mixed in).
  - job_name: 'kafka-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          stack: 'my-microservices'
