# Notification policy tree — maps firing alerts to contact points.
# Simple tree: everything goes to mailhog-dev, grouped by alertname so
# a storm of partition-level alerts collapses into one message.
#
# Docs: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/#notification-policies

apiVersion: 1

policies:
  - orgId: 1
    receiver: mailhog-dev
    group_by: [alertname, severity]
    group_wait: 30s
    group_interval: 2m
    repeat_interval: 1h
    # No child routes yet. Add one here when you want, e.g.,
    # critical → PagerDuty while warnings continue to mailhog:
    #   routes:
    #     - receiver: pagerduty
    #       matchers:
    #         - severity = critical
