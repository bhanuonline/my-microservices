server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape every Docker container on the host.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # Parse JSON lines emitted by logback-observability.xml.
      - json:
          expressions:
            level: level
            traceId: traceId
            correlationId: correlationId
            svc: service
            logger: logger_name
      # Promote low-cardinality fields to labels. NEVER promote traceId /
      # correlationId — those are high-cardinality and would blow up Loki's
      # index. They stay as parsed fields, queryable via `| json | traceId=".."`.
      - labels:
          level:
          svc:
