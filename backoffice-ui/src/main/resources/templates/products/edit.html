<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${mode == 'new' ? 'New product' : 'Edit product'}">Product</title></head>
<body>
<div layout:fragment="content">
    <nav class="small mb-3"><a th:href="@{/products}">← Products</a></nav>

    <h1 class="h4 mb-3"
        th:text="${mode == 'new' ? 'Add a new product' : 'Edit product ' + id}">Product</h1>

    <div th:if="${mode == 'edit' and product == null}" class="alert alert-warning">
        Product <code th:text="${id}">?</code> not found (404 from product-service).
    </div>

    <form th:action="${mode == 'new' ? '/products/new' : '/products/' + id}" method="post">
        <div class="row g-3">
            <div class="col-md-7"><div class="tile">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input class="form-control" name="name" required
                           th:value="${product != null ? product.get('name').asText() : ''}"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="3"
                              th:text="${product != null ? product.get('description').asText() : ''}"></textarea>
                </div>
                <div class="row">
                    <div class="col-sm-4 mb-3">
                        <label class="form-label">Price</label>
                        <input class="form-control" type="number" step="0.01" name="price" required
                               th:value="${product != null ? product.get('price').asDouble() : ''}"/>
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label class="form-label">Stock</label>
                        <input class="form-control" type="number" name="quantityInStock" required
                               th:value="${product != null ? product.get('quantityInStock').asInt() : 0}"/>
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label class="form-label">SKU</label>
                        <input class="form-control" name="sku"
                               th:value="${product != null and product.has('sku') ? product.get('sku').asText() : ''}"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label class="form-label">Category</label>
                        <input class="form-control" name="category"
                               th:value="${product != null and product.has('category') ? product.get('category').asText() : ''}"/>
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label class="form-label">Brand</label>
                        <input class="form-control" name="brand"
                               th:value="${product != null and product.has('brand') ? product.get('brand').asText() : ''}"/>
                    </div>
                </div>
            </div></div>

            <div class="col-md-5"><div class="tile">
                <h2 class="h6 text-muted">Save</h2>
                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-check-lg"></i>
                    <span th:text="${mode == 'new' ? 'Create' : 'Save changes'}">Save</span>
                </button>
                <p class="small text-muted mt-2 mb-0">
                    Writes go through <code>product-service</code> which emits a
                    <code>product.updated</code> event — the ES read model picks
                    it up within ~1&nbsp;second.
                </p>
            </div></div>
        </div>
    </form>

    <form th:if="${mode == 'edit'}"
          th:action="@{'/products/' + ${id} + '/delete'}" method="post"
          class="mt-3"
          onsubmit="return confirm('Delete this product? The ES doc will be removed on the next projector tick.');">
        <button class="btn btn-sm btn-outline-danger">
            <i class="bi bi-trash"></i> Delete product
        </button>
    </form>
</div>
</body>
</html>
