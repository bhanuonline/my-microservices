<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Feature flags</title></head>
<body>
<div layout:fragment="content">
    <h1 class="h4 mb-3">Feature flags</h1>

    <div class="tile p-0 mb-3">
        <table class="table ops mb-0">
            <thead class="small text-muted">
                <tr><th>Key</th><th>Description</th><th>Enabled</th><th>Rules</th><th>Updated</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="f : ${flags}">
                    <td><code th:text="${f.get('flagKey').asText()}">key</code></td>
                    <td class="small"
                        th:text="${f.has('description') ? f.get('description').asText() : '—'}">—</td>
                    <td>
                        <span class="badge"
                              th:classappend="${f.get('enabled').asBoolean()} ? 'bg-success' : 'bg-secondary'"
                              th:text="${f.get('enabled').asBoolean() ? 'ON' : 'OFF'}">OFF</span>
                    </td>
                    <td class="small text-muted"
                        th:text="${f.has('rulesJson') ? f.get('rulesJson').asText() : '—'}">—</td>
                    <td class="small text-muted"
                        th:text="${f.has('updatedAt') ? f.get('updatedAt').asText() : '—'}">—</td>
                    <td class="text-end">
                        <form th:action="@{'/flags/' + ${f.get('flagKey').asText()} + '/toggle'}"
                              method="post" style="display:inline">
                            <button class="btn btn-sm btn-outline-secondary">Toggle</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${flags == null or flags.size() == 0}">
                    <td colspan="6" class="text-center text-muted py-3">No flags defined yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="tile">
        <h2 class="h6">Create or update a flag</h2>
        <form th:action="@{/flags/new-flag-key}" method="post" id="upsertForm">
            <div class="row g-2">
                <div class="col-md-3">
                    <input class="form-control form-control-sm" name="key" placeholder="flag-key"
                           id="keyInput" required
                           oninput="document.getElementById('upsertForm').action = '/flags/' + encodeURIComponent(this.value)"/>
                </div>
                <div class="col-md-5">
                    <input class="form-control form-control-sm" name="description"
                           placeholder="description"/>
                </div>
                <div class="col-md-2">
                    <input class="form-control form-control-sm" type="number" name="percentage"
                           min="0" max="100" value="0" title="% rollout"/>
                </div>
                <div class="col-md-2 form-check mt-1">
                    <input class="form-check-input" type="checkbox" name="enabled" value="true" id="en"/>
                    <label class="form-check-label small" for="en">enabled</label>
                </div>
            </div>
            <div class="row g-2 mt-2">
                <div class="col-md-6">
                    <input class="form-control form-control-sm" name="tenantWhitelist"
                           placeholder="tenant whitelist (csv)"/>
                </div>
                <div class="col-md-6">
                    <input class="form-control form-control-sm" name="userWhitelist"
                           placeholder="user whitelist (csv)"/>
                </div>
            </div>
            <button class="btn btn-sm btn-primary mt-3">Save</button>
        </form>
    </div>
</div>
</body>
</html>
