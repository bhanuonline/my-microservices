server:
  port: 8761

spring:
  main:
    web-application-type: servlet
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false   # Eureka itself doesn't register with Eureka
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  info:
    env: { enabled: true }
    build: { enabled: true }
    git: { mode: simple, enabled: true }
    java: { enabled: true }
    os: { enabled: true }
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: Eureka Server
    description: Service discovery registry
    port: ${server.port}
