<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin — Clients</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<div th:replace="~{admin/layout :: nav}"></div>

<main class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">OAuth Clients</h1>
    <a class="btn btn-primary" th:href="@{/admin/clients/new}">+ New Client</a>
  </div>

  <div th:if="${#lists.isEmpty(clients)}" class="alert alert-info">
    No clients registered yet.
  </div>

  <table th:unless="${#lists.isEmpty(clients)}" class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th>Client ID</th>
        <th>Name</th>
        <th>Grant Types</th>
        <th>Scopes</th>
        <th style="width: 200px;">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="c : ${clients}">
        <td th:text="${c.client_id}">demo-client</td>
        <td th:text="${c.client_name}">Demo Client</td>
        <td><code th:text="${c.authorization_grant_types}"></code></td>
        <td><code th:text="${c.scopes}"></code></td>
        <td>
          <a class="btn btn-sm btn-outline-secondary"
             th:href="@{|/admin/clients/${c.id}/edit|}">Edit</a>
          <form th:action="@{|/admin/clients/${c.id}/delete|}"
                method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-danger"
                    onclick="return confirm('Delete this client?');">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
