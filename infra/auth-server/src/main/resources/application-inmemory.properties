# Active profile: inmemory
# All defaults inherited from application.properties (matches today's behaviour).
# JDBC/Flyway overrides live in application-jdbc.properties.

# Keep Flyway off on this profile — Flyway is on the classpath (needed by 'jdbc'),
# but 'inmemory' must not run any migrations against authdb.
spring.flyway.enabled=false

# Feature flags off on this profile — inmemory has no admin UI to consume them.
features.refresh-token-rotation.enabled=false
features.pkce.enforce-for-public-clients=false
features.pkce.warn-for-confidential-clients=false
features.key-rotation.enabled=false
features.audit.enabled=false
features.account-lockout.enabled=false
features.rate-limit.enabled=false
features.custom-claims.enabled=false
features.metrics.enabled=false
features.consent-page.enabled=false
features.dcr.enabled=false
features.rest-api.enabled=false
features.kms-keys.enabled=false
features.tracing.enabled=false
management.tracing.enabled=false
